<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twitter Follower Counts</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #5f6b7a;
          --accent: #2f6fde; --bad: #c0392b; --border: #dde2e8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 20px; }
  section { background: var(--card); border: 1px solid var(--border);
            border-radius: 8px; padding: 18px; }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  textarea { width: 100%; min-height: 60px; padding: 8px 10px; font: inherit;
             border: 1px solid var(--border); border-radius: 6px; }
  button { margin-top: 10px; padding: 8px 14px; border: 0; border-radius: 6px;
           background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  .muted { color: var(--muted); font-size: .9rem; }
  .error { color: var(--bad); }
  ul.results { list-style: none; padding: 0; margin: 12px 0 0;
               font-family: ui-monospace, Menlo, monospace; }
  ul.results li { padding: 2px 0; }
</style>
</head>
<body>
<main>
  <h1>Twitter Follower Counts</h1>
  <p class="lead">Counts computed by a Spark job on AWS EMR Serverless and served by an AWS Lambda API.</p>

  <section>
    <label for="ids">User IDs (comma or space separated)</label>
    <textarea id="ids">214328887, 107830991</textarea>
    <button id="lookup">Get counts</button>
    <p id="status" class="muted"></p>
    <ul id="results" class="results"></ul>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);

function setStatus(text, kind) {
  $("status").textContent = text;
  $("status").className = kind || "muted";
}

// Call the back-end API and list each user in the required format.
async function lookUp() {
  const query = new URLSearchParams({ ids: $("ids").value });
  setStatus("Loading…");
  $("results").innerHTML = "";
  try {
    const response = await fetch(`/users?${query}`);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);

    for (const user of data.users) {
      const lines = user.found
        ? [`${user.user_id} has ${user.followers} followers`,
           `${user.user_id} has ${user.followees} followees`]
        : [`${user.user_id} was not found in the dataset`];
      for (const line of lines) {
        const li = document.createElement("li");
        li.textContent = line;
        $("results").appendChild(li);
      }
    }
    setStatus(`Source: ${data.results}`);
  } catch (error) {
    setStatus(error.message, "error");
  }
}

$("lookup").onclick = lookUp;
lookUp();  // show the two required users as soon as the page opens
</script>
</body>
</html>
